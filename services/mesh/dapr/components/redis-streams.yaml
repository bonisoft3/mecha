apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: env
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: redis-streams
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      secretKeyRef:
        name: REDIS_HOST
        key: REDIS_HOST
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "mecha"
    - name: enableTLS
      value: "false"
    - name: processingTimeout
      value: "30s"
    - name: redeliverInterval
      value: "5s"
    - name: maxRetries
      value: "5"
    - name: concurrency
      value: "1"
auth:
  secretStore: env
