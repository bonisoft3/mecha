version: '3'

vars:
  PROTO_DIR: proto
  GEN_DIR: gen

tasks:
  # ================================================================
  # Code generation pipeline
  # ================================================================

  buf:generate:
    desc: "Generate JSON Schema from protobuf"
    dir: "{{.PROTO_DIR}}"
    cmds:
      - mkdir -p ../{{.GEN_DIR}}/jsonschema
      - buf generate
    sources:
      - "*.proto"
      - "buf.gen.yaml"
    generates:
      - "../{{.GEN_DIR}}/jsonschema/**/*.json"

  cue:generate:
    desc: "Generate convention-based templates via CUE+gomplate"
    deps: [buf:generate]
    cmds:
      # mise x puts real tool bin dirs on PATH — the .cmd file shims
      # Windows CI uses are invisible to the bash this tool spawns.
      - mise x -- cue cmd generate tmpl_tool.cue
    sources:
      - "**/*.tmpl"
      - "**/*.cue"
    generates:
      - "**/*.hcl"
      - "**/*.yaml"
      - "**/*.conf"
      - "**/*.sql"

  generate:
    desc: "Generate all artifacts from protobuf schemas and atlas"
    deps: [buf:generate, cue:generate, atlas:hash]
    cmds:
      - echo "Generated all artifacts"

  # ================================================================
  # Launch — start the stack with hot reload (--watch)
  # ================================================================
  # A bare `up` is the whole stack: the cluster plus stream processing and
  # the AI gateway's seat (compose.yml includes what bayt emits for bayt.cue).

  launch:
    desc: "Start the stack with hot reload"
    deps: [generate]
    cmds:
      - docker compose up --build --watch

  # ================================================================
  # Unit tests — pure, fast, offline (no network, no Docker daemon)
  # ================================================================

  test:
    desc: "Run unit tests: cue vet + buf lint + Deno services (pure, cross-platform)"
    deps: [buf:generate]
    cmds:
      # Select packages explicitly: bayt.cue adds a `mecha` package to the
      # root, so an unqualified `cue vet ./...` errors on the mixed dir.
      - cue vet ./...:tmpl ./...:database
      - buf lint proto
      - task: test:ticker

  test:ticker:
    desc: "ticker unit tests (pure: no clock, no network)"
    dir: services/ticker
    cmds:
      # mise x puts the real tool bin dir on PATH — see cue:generate.
      - mise x -- deno test --allow-read --allow-env .
    sources:
      - "*.ts"
      - "deno.json"
      - "deno.lock"

  # ================================================================
  # Smoke tests
  # ================================================================

  # Each suite waits on the slice it exercises, so running one brings that
  # slice up. The crud and cdc suites exit with their verdict; the stream
  # and blobs suites hold while their healthcheck asserts, so `up --wait`
  # returns on that verdict instead.

  integrate:
    desc: "Run crud smoke tests"
    cmds:
      - docker compose run --build smoke

  integrate:cdc:
    desc: "Run CDC pipeline smoke tests"
    cmds:
      - docker compose run --build smoke-cdc

  integrate:stream:
    desc: "Run stream analytics smoke tests (Arroyo E2E)"
    cmds:
      - docker compose up --build --wait smoke-stream

  integrate:blobs:
    desc: "Run blobs smoke tests (rclone-s3 + imgproxy)"
    cmds:
      - docker compose up --build --wait smoke-blobs

  # ================================================================
  # Benchmarks
  # ================================================================

  benchmark:
    desc: "Run startup + CRUD + CDC benchmarks"
    cmds:
      - nu scripts/benchmark.nu

  # ================================================================
  # Atlas — dev-time migration generation from HCL schema
  # ================================================================

  atlas:diff:
    desc: "Generate versioned migration from HCL schema changes"
    cmds:
      - |
        atlas migrate diff {{.CLI_ARGS | default "schema_change"}} \
          --dir "file://services/database/migrations" \
          --dev-url "docker://postgres/18/dev" \
          --to "file://services/database/schemas/"
        atlas migrate hash --dir file://services/database/migrations
    sources:
      - "services/database/schemas/*.hcl"

  atlas:hash:
    desc: "Regenerate atlas.sum after migration changes"
    cmds:
      - atlas migrate hash --dir file://services/database/migrations
    sources:
      - "services/database/migrations/*.sql"
    generates:
      - "services/database/migrations/atlas.sum"

  # ================================================================
  # Utility
  # ================================================================

  clean:
    desc: "Stop all services and remove generated files"
    cmds:
      - docker compose --profile '*' down -v || true
      - rm -rf gen/*
