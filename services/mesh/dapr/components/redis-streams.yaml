apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: env
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: redis-streams
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      secretKeyRef:
        name: REDIS_HOST
        key: REDIS_HOST
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "mecha"
    - name: enableTLS
      value: "false"
    # Only durable retry subscribes through Dapr. Its resiliency policy
    # (resiliency.yaml) owns the attempts and keeps a record pending for up to
    # twenty minutes, which redelivery after this timeout would duplicate.
    - name: processingTimeout
      value: "1h"
    - name: redeliverInterval
      value: "1m"
    - name: concurrency
      value: "1"
auth:
  secretStore: env
