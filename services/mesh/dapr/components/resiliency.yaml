apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: mecha-resiliency
spec:
  policies:
    retries:
      publish:
        policy: exponential
        maxInterval: 15s
        maxRetries: -1
      # Durable retry's redeliveries, only where a release subscribes to a
      # group's retry stream: about twenty minutes of backoff before the record
      # is dead-lettered, inside redis-streams.yaml's processingTimeout.
      redeliver:
        policy: exponential
        initialInterval: 1s
        maxInterval: 5m
        maxRetries: 12
    circuitBreakers:
      default-breaker:
        maxRequests: 20
        trip: consecutiveFailures > 5
        timeout: 30s
  targets:
    components:
      redis-streams:
        outbound:
          retry: publish
          circuitBreaker: default-breaker
        inbound:
          retry: redeliver
