say:
  self: {}
  build:
    rulemap:
      activepieces-mail-acceptance:
        priority: -1
        stop: true
        cmds:
          - do: "mise x github:denoland/deno@2.9.7 -- deno check --frozen integrate_test.ts transport_test.ts tls_test.ts process_test.ts"
  lint:
    rulemap:
      activepieces-mail-acceptance:
        priority: -1
        stop: true
        cmds:
          - do: "mise x github:denoland/deno@2.9.7 -- deno lint *.ts"
          - do: "mise x github:denoland/deno@2.9.7 -- deno fmt --check *.ts deno.json"
  test:
    rulemap:
      activepieces-mail-acceptance:
        priority: -1
        stop: true
        cmds:
          - do: "mise x github:denoland/deno@2.9.7 -- deno test --frozen --allow-run --allow-net=127.0.0.1 process_test.ts"
  integrate:
    rulemap:
      activepieces-mail-acceptance:
        priority: -1
        stop: true
        cmds:
          - do: "mise x github:denoland/deno@2.9.7 -- deno test --frozen --allow-read --allow-write --allow-env --allow-net --allow-run --allow-sys=ca integrate_test.ts transport_test.ts tls_test.ts"
