apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: confirm
spec:
  type: bindings.http
  version: v1
  metadata:
    - name: url
      secretKeyRef:
        name: BRIDGE_BRIDGE_MAIL_URL
        key: BRIDGE_BRIDGE_MAIL_URL
    - name: errorIfNot2XX
      value: "false"
auth:
  secretStore: env
