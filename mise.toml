[settings]
lockfile = true
locked = true
experimental = true
paranoid = false
github_attestations = false
slsa = false
github.slsa = false
github.github_attestations = false
aqua.github_attestations = false
aqua.cosign = false
aqua.slsa = false
aqua.minisign = false

[tools]
"github:bufbuild/buf" = "1.66.1"
"github:cue-lang/cue" = "0.16.1"
"github:hairyhenderson/gomplate" = "5.0.0"
"github:denoland/deno" = "v2.9.7"
"github:go-task/task" = "v3.49.1"
"github:dapr/dapr" = "1.17.3"
"github:dapr/cli" = "1.17.0"
"github:redpanda-data/connect" = "4.46.0"
# The JS estate here is node's: vitest over the packages, and a dev server
# written to the Web fetch shape over node:http. pnpm is the repository's
# package manager, and pnpm-workspace.yaml lists every member here.
node = "22.14.0"
"github:pnpm/pnpm" = "10.32.1"

[tools."http:atlas"]
version = "0.38.0"
url = 'https://release.ariga.io/atlas/atlas-{{ os(macos="darwin") }}-{{ arch(x64="amd64") }}-v{{ version }}{% if os() == "windows" %}.exe{% endif %}'

# Redis runs in Docker (events profile). Native Windows binary available at
# https://github.com/redis-windows/redis-windows if needed for native dev.
