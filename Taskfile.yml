version: '3'

vars:
  PROTO_DIR: proto
  GEN_DIR: gen

tasks:
  # ================================================================
  # Code generation pipeline
  # ================================================================

  buf:generate:
    desc: "Generate JSON Schema from protobuf"
    dir: "{{.PROTO_DIR}}"
    cmds:
      - mkdir -p ../{{.GEN_DIR}}/jsonschema
      - buf generate
    sources:
      - "*.proto"
      - "buf.gen.yaml"
    generates:
      - "../{{.GEN_DIR}}/jsonschema/**/*.json"

  generate:
    desc: "Generate all artifacts from protobuf schemas"
    deps: [buf:generate]
    cmds:
      - echo "Generated all artifacts"

  # ================================================================
  # Launch — start the stack with hot reload (--watch)
  # ================================================================
  # A bare `up` is the whole stack: the cluster plus stream processing and
  # the AI gateway's seat (compose.yml includes what bayt emits for bayt.cue).

  launch:
    desc: "Start the stack with hot reload"
    deps: [generate]
    cmds:
      - docker compose up --build --watch

  # ================================================================
  # Unit tests — pure, fast, offline (no network, no Docker daemon)
  # ================================================================

  test:
    desc: "Run unit tests: cue vet + buf lint + Deno services (pure, cross-platform)"
    deps: [buf:generate]
    cmds:
      # Select the package explicitly: bayt.cue adds a `mecha` package to the
      # root, so an unqualified `cue vet ./...` errors on the mixed dir.
      - cue vet ./...:tmpl
      - buf lint proto
      - task: test:ticker
      - task: test:compute
      - task: test:pgroll
      - task: test:cluster
      - task: test:browser

  test:browser:
    desc: "browser PostgREST reads under their request scopes"
    dir: packages/mecha-browser
    cmds:
      - mise x -- deno test --config cluster.deno.json --lock deno.lock --frozen --allow-read --allow-env rest_read_test.ts

  test:cluster:
    desc: "what a cluster refuses of its initdb steps, and which services its change feed brings"
    cmds:
      # mise x puts the real tool bin dir on PATH — see cue:generate.
      - mise x -- deno test --no-config --no-lock --allow-read --allow-run=cue cluster_test.ts

  test:pgroll:
    desc: "pgroll grammar against the pinned image, and what the cluster's field refuses"
    cmds:
      # mise x puts the real tool bin dir on PATH — see cue:generate.
      - mise x -- deno test --no-config --no-lock --allow-read --allow-write --allow-run=cue pgroll/pgroll_test.ts

  test:compute:
    desc: "compute service: scheduling, sinks, the cage, the WASI host; the Postgres cases run where initdb is on PATH"
    dir: services/compute
    cmds:
      # The extensions the Postgres cases load, installed once beside main.ts
      # as the image installs them.
      - mise x -- deno run --frozen --allow-ffi --allow-read --allow-write --allow-net --allow-env install.ts
      - mise x -- deno test --frozen --unstable-worker-options --allow-ffi --allow-read --allow-write --allow-net --allow-env --allow-run .
    sources:
      - "*.ts"
      - "deno.json"
      - "deno.lock"

  test:ticker:
    desc: "ticker unit tests (pure: no clock, no network)"
    dir: services/ticker
    cmds:
      # mise x puts the real tool bin dir on PATH — see cue:generate.
      - mise x -- deno test --allow-read --allow-env .
    sources:
      - "*.ts"
      - "deno.json"
      - "deno.lock"

  # ================================================================
  # Smoke tests
  # ================================================================

  # Each suite waits on the slice it exercises, so running one brings that
  # slice up. The crud and cdc suites exit with their verdict; the stream
  # and blobs suites hold while their healthcheck asserts, so `up --wait`
  # returns on that verdict instead.

  integrate:
    desc: "Run crud smoke tests"
    cmds:
      - docker compose run --build smoke

  integrate:cdc:
    desc: "Run CDC pipeline smoke tests"
    cmds:
      - docker compose run --build smoke-cdc

  integrate:stream:
    desc: "Run stream analytics smoke tests (Arroyo E2E)"
    cmds:
      - docker compose up --build --wait smoke-stream

  integrate:blobs:
    desc: "Run blobs smoke tests (rclone-s3 + imgproxy)"
    cmds:
      - docker compose up --build --wait smoke-blobs

  # ================================================================
  # Benchmarks
  # ================================================================

  benchmark:
    desc: "Run startup + CRUD + CDC benchmarks"
    cmds:
      - nu scripts/benchmark.nu



  # ================================================================
  # Utility
  # ================================================================

  clean:
    desc: "Stop all services and remove generated files"
    cmds:
      - docker compose --profile '*' down -v || true
      - rm -rf gen/*
