# The airlock daprd's configuration: invocation and bindings over HTTP behind
# the wall (the cluster's wall.yaml, one rule over the declared effects), and
# bindings alone over gRPC, which daprd always serves and which an HTTP-only list
# leaves whole. Together they keep a mistake from reaching an undeclared host or
# another Dapr API; neither is a security boundary (README, "The wall").
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: airlock
spec:
  httpPipeline:
    handlers:
      - name: wall
        type: middleware.http.routerchecker
  api:
    allowed:
      - name: invoke
        version: v1.0
        protocol: http
      - name: bindings
        version: v1.0
        protocol: http
      - name: bindings
        version: v1
        protocol: grpc
