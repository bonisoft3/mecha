      SERVICE_JWT=${SERVICE_JWT:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZSIsInN1YiI6IjAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMCIsImV4cCI6MTk4ODE1MDQwMH0.dGYz_sMSnOvZy0eANh7spJbgyr2fEzeynOERIqW7gd4}
    - WAKE_URLS=http://127.0.0.1:${MESH_EVENTS_HTTP_PORT:-17538}/v1.0/healthz/outbound
  clock:
    depends_on:
      ticker:
        condition: process_started
    entrypoint:
    - mise
    - x
    - --
    - nu
    - -c
    - >-
      let yml = (if (($$env.CLOCK_YAML? | default '') != '') { $$env.CLOCK_YAML }
      else if ('services/clock/clock.yaml' | path exists) { 'services/clock/clock.yaml' }
      else { ((^mise where github:bonisoft3/mecha | str trim) | path join
      'services/clock/clock.yaml') }); exec redpanda-connect run --set 'http.enabled=false' $$yml
    availability:
      exit_on_skipped: true
      restart: on_failure
      backoff_seconds: 1
      max_restarts: 15
    environment:
    - POKE_CALLER=compose
    - POKE_INTERVAL=${POKE_INTERVAL:-60s}
    - POKE_URL=http://127.0.0.1:${TICKER_HTTP_PORT:-11760}
    - >-
      SERVICE_JWT=${SERVICE_JWT:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZSIsInN1YiI6IjAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMCIsImV4cCI6MTk4ODE1MDQwMH0.dGYz_sMSnOvZy0eANh7spJbgyr2fEzeynOERIqW7gd4}
  launch:
    depends_on:
      caddy:
        condition: process_healthy
      database:
        condition: process_healthy
      crud:
        condition: process_healthy
      electric:
        condition: process_healthy
      redis:
        condition: process_healthy
      mesh-events:
        condition: process_healthy
      conduit:
        condition: process_healthy
      transform:
        condition: process_started
      auth:
        condition: process_started
      rclone-s3:
        condition: process_healthy
      imgproxy:
        condition: process_healthy
      clock:
        condition: process_started
    entrypoint:
    - mise
    - x
    - --
    - nu
    - -c
    - loop { sleep 1hr }
    availability:
      exit_on_skipped: true
    readiness_probe:
      exec:
        command: mise x -- nu -c exit
      period_seconds: 1
      timeout_seconds: 5
      failure_threshold: 10
  migrate:
    depends_on:
      database:
        condition: process_healthy
    entrypoint:
    - mise
    - x
    - --
    - nu
    - -c
    - >-
      let os = (match $$nu.os-info.name { 'macos' => 'macos', 'windows' => 'windows',
      _ => 'linux' }); let dir = (if (($$env.PRONTO_REPLAY_PGROLL_DIR? | default '')
      != '') { $$env.PRONTO_REPLAY_PGROLL_DIR } else if ('/pgroll' | path exists) {
      '/pgroll' } else { let d = (($$env.BAYT_LOCAL_WORK_DIR? | default $$nu.temp-dir) |
      path join 'pgroll'); rm -rf $$d; mkdir $$d; let m = (open .bayt/bayt.migrate.json |
      get dockerfile); ($$m | get -o copy | default []) | each {|c| cp ($$c.srcs.0)
      ($$d | path join ($$c.dst | path basename)) } | ignore; ($$m | get -o epilogue |
      default []) | each {|e| let lines = ($$e | lines); if ($$lines.0 | str starts-with
      "COPY <<'PGROLL' /tmp/") { let name = ($$lines.0 | parse "COPY <<'PGROLL'
      /tmp/{name}.parts" | get 0.name); ($$lines | skip 1 | take while {|l| $$l != "PGROLL" }
      | str join "" | decode base64) | save --raw -f ($$d | path join $$name) } else if
      ($$lines.0 | str starts-with "COPY <<'PGROLL' /pgroll/") { let name = ($$lines.0
      | parse "COPY <<'PGROLL' /pgroll/{name}" | get 0.name); $$lines.1 | save --raw
      -f ($$d | path join $$name) } else if ($$lines.0 | str starts-with "COPY
      <<'RECONCILE' /pgroll/") { let name = ($$lines.0 | parse "COPY <<'RECONCILE'
      /pgroll/{name}" | get 0.name); ($$lines | skip 1 | drop 1 | str join "\\n") | save --raw -f
      ($$d | path join $$name) } } | ignore; $$d }); let script = (if
      (($$env.PRONTO_MIGRATE_SH? | default '') != '') { $$env.PRONTO_MIGRATE_SH } else if
      ('services/migrate/migrate.nu' | path exists) { 'services/migrate/migrate.nu' } else if
      ('/migrate.sh' | path exists) and ($$os != 'windows') { '/migrate.sh' } else { ((^mise
      where github:bonisoft3/mecha | str trim) | path join 'services/migrate/migrate.nu')
      }); if ($$script | str ends-with '.nu') { ^nu $$script $$dir 00_initdb } else {
      ^bash $$script $$dir 00_initdb }
    availability:
      exit_on_skipped: true
    environment:
    - >-
      DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:${DATABASE_PG_PORT:-17726}/${POSTGRES_DB:-mecha}?sslmode=disable
    - REQUIRED_TABLES=schedule
